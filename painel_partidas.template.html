<title>Partidas Cinema Porto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one departures board. Header with live clock, a filter strip, then
   rows of split-flap tiles; on phones each row folds into two lines. */
:root {
  color-scheme: dark;
  --board: #0c0f13;
  --panel: #12161c;
  --tile: #1b2028;
  --tile-hi: #232a34;
  --seam: #06080a;
  --rule: #232933;
  --flap: #f6c64a;
  --ink: #e9edf2;
  --dim: #8792a1;
  --ok: #43d68a;
  --warn: #ffa630;
  --crit: #ff5a52;
  --g-nos: #f0f3f7;
  --g-uci: #6cb6ff;
  --g-cl: #ff8a66;
  --g-ind: #c3b1ff;
  --font-sign: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-flap: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--board); color: var(--ink); }
body { font-family: var(--font-sign); margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; }

/* ---- header ---- */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px;
        padding-bottom: 16px; border-bottom: 2px solid var(--rule); }
.title { display: flex; align-items: center; gap: 16px; min-width: 0; }
.glyph { width: 52px; height: 52px; flex: none; border-radius: 6px; background: var(--flap); color: var(--board);
         display: grid; place-items: center; }
.glyph svg { width: 34px; height: 34px; }
h1 { margin: 0; font-weight: 700; font-size: clamp(30px, 5vw, 48px); line-height: .95; letter-spacing: .04em;
     text-transform: uppercase; color: var(--flap); text-wrap: balance; }
h1 small { display: block; font-size: .42em; letter-spacing: .14em; color: var(--dim); font-weight: 600; margin-top: 6px; }
.clock { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.clock .date { font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.tiles { display: inline-flex; gap: 3px; }
.t { position: relative; display: inline-grid; place-items: center; font-family: var(--font-flap); font-weight: 600;
     background: linear-gradient(var(--tile-hi) 0 50%, var(--tile) 50% 100%); color: var(--flap);
     border-radius: 3px; width: .92em; height: 1.45em; line-height: 1; }
.t::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--seam); }
.t.sep { background: none; width: .42em; }
.t.sep::after { display: none; }
.clock .tiles { font-size: 30px; }

/* ---- filters ---- */
.bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--rule); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font: 600 15px/1 var(--font-sign); letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
              background: none; border: 0; border-radius: 4px; padding: 8px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--flap); color: var(--board); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
label.sel { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: .12em;
            text-transform: uppercase; color: var(--dim); }
select { font: 600 16px var(--font-sign); letter-spacing: .04em; color: var(--ink); background: var(--panel);
         border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; max-width: 60vw; }
:focus-visible { outline: 2px solid var(--flap); outline-offset: 2px; }
.count { margin-left: auto; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
         font-variant-numeric: tabular-nums; }

/* ---- board ---- */
.board { margin-top: 6px; }
.row { display: grid; align-items: center; gap: 14px;
       grid-template-columns: 8em minmax(0, 2.4fr) minmax(0, 1.5fr) 6.2em 5.6em 3.6em 9.6em;
       padding: 9px 4px; border-bottom: 1px solid var(--rule); }
.row.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1; background: var(--board);
           padding-block: 12px 8px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.row.hdr span i { display: block; font-style: normal; font-size: 11px; opacity: .65; }
.row.day { display: block; padding: 18px 4px 8px; border-bottom: 0; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--flap); }
.time { font-size: 21px; }
.time .tiles, .gate .tiles { font-size: 1em; }
.film { min-width: 0; }
.film b { display: block; font-weight: 600; font-size: 21px; letter-spacing: .03em; text-transform: uppercase;
          color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.film em { font-style: normal; font-size: 13px; letter-spacing: .1em; color: var(--dim); }
.dest { display: flex; align-items: center; gap: 10px; min-width: 0; }
.code { flex: none; display: inline-grid; place-items: center; width: 3.1em; font-family: var(--font-flap); font-weight: 600;
        font-size: 13px; color: var(--board); background: var(--g-ind); border-radius: 3px; padding: 3px 0; letter-spacing: .04em; }
.code.g-NOS { background: var(--g-nos); }
.code.g-UCI { background: var(--g-uci); }
.code.g-CL { background: var(--g-cl); }
.dest span { font-size: 19px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.gate { font-size: 17px; }
.gate .none { color: var(--dim); font-family: var(--font-flap); }
.fmt { font-family: var(--font-flap); font-size: 13px; color: var(--dim); line-height: 1.3; }
.fmt b { color: var(--ink); font-weight: 600; }
.imdb { font-family: var(--font-flap); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); text-decoration: none; }
.imdb.lo { color: var(--dim); }
a.imdb:hover { color: var(--flap); }
.status { justify-self: start; font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
          padding: 5px 10px; border-radius: 4px; border: 1px solid currentColor; color: var(--dim); white-space: nowrap; }
.status.ok { color: var(--ok); }
.status.warn { color: var(--board); background: var(--warn); border-color: var(--warn); animation: blink 1.1s steps(2, start) infinite; }
.status.gone { color: var(--dim); opacity: .6; border-style: dashed; }
.row.past .time, .row.past .film b, .row.past .dest span { opacity: .45; }
@keyframes blink { to { background: transparent; color: var(--warn); } }

.empty { padding: 48px 4px; color: var(--dim); font-size: 19px; letter-spacing: .04em; max-width: 60ch; }
.empty b { color: var(--flap); }
.foot { margin-top: 26px; color: var(--dim); font-size: 14px; letter-spacing: .06em; line-height: 1.5; max-width: 90ch; }

@media (max-width: 980px) {
  .row { grid-template-columns: 8em minmax(0, 1fr) 6.2em 9.6em; }
  .row .fmt, .row .imdb, .row.hdr .h-fmt, .row.hdr .h-imdb { display: none; }
  .row .film { grid-column: 2; }
  .row .dest { grid-column: 2; grid-row: 2; margin-top: -6px; }
  .row .gate { grid-column: 3; grid-row: 1 / span 2; }
  .row .status { grid-column: 4; grid-row: 1 / span 2; }
  .row .time { grid-row: 1 / span 2; }
  .row.hdr .h-dest { display: none; }
}
@media (max-width: 560px) {
  .row { grid-template-columns: 6.4em minmax(0, 1fr) auto; gap: 4px 10px; }
  .row .gate, .row.hdr .h-gate { display: none; }
  .row .status { grid-column: 3; font-size: 12px; padding: 4px 6px; }
  .time { font-size: 17px; }
  .film b { font-size: 18px; }
  .dest span { font-size: 15px; }
  .clock { align-items: flex-start; }
  .clock .tiles { font-size: 24px; }
  .count { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .status.warn { animation: none; } }
</style>

<div class="wrap">
  <header class="head">
    <div class="title">
      <div class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="13" rx="1.5" fill="none"/>
          <path d="M3 10h18M7 6l2-3M12 6l2-3M17 6l2-3" fill="none"/>
        </svg>
      </div>
      <h1>Partidas<small>Sessões de cinema · Distrito do Porto</small></h1>
    </div>
    <div class="clock" aria-live="off">
      <div class="date" id="today"></div>
      <div class="tiles" id="clock" aria-label="Hora de Lisboa"></div>
    </div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Período">
      <button type="button" id="w-3h" data-win="3h">Próximas 3 h</button>
      <button type="button" id="w-hoje" data-win="hoje">Hoje</button>
      <button type="button" id="w-amanha" data-win="amanha">Amanhã</button>
      <button type="button" id="w-todas" data-win="todas">Todas</button>
    </div>
    <label class="sel" for="f-cinema">Cinema <select id="f-cinema"></select></label>
    <label class="sel" for="f-fmt">Formato <select id="f-fmt"></select></label>
    <div class="count" id="count"></div>
  </div>

  <div class="board" id="board" role="table" aria-label="Próximas sessões"></div>

  <p class="foot" id="foot"></p>
</div>

<script id="dados" type="application/json">__DADOS__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("dados").textContent);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DAY = 86400000;

  // Hora de Lisboa como "relógio de parede" em UTC, para comparar com as sessões.
  const fmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Lisbon", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  function agora() {
    const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x => [x.type, x.value]));
    return { ms: Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute, +p.second),
             dia: `${p.year}-${p.month}-${p.day}`, hms: `${p.hour}:${p.minute}:${p.second}` };
  }
  const diaMs = d => { const [y, m, dd] = d.split("-").map(Number); return Date.UTC(y, m - 1, dd); };
  const isoDe = ms => new Date(ms).toISOString().slice(0, 10);

  // Sessões depois da meia-noite pertencem ao dia de cinema anterior.
  const S = D.sessoes.map(([dia, hora, cid, fid, sala, formatos]) => {
    const [h, m] = hora.split(":").map(Number);
    return { dia, hora, cid, fid, sala, formatos: formatos ? formatos.split(" ") : [],
             ms: diaMs(dia) + (h < 5 ? DAY : 0) + (h * 60 + m) * 60000 };
  }).sort((a, b) => a.ms - b.ms || D.cinemas[a.cid].nome.localeCompare(D.cinemas[b.cid].nome));

  const SEMANA = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const nomeDia = iso => { const d = new Date(diaMs(iso)); return `${SEMANA[d.getUTCDay()]} ${d.getUTCDate()} ${MESES[d.getUTCMonth()]}`; };

  // ---- estado dos filtros (lembrado só neste browser) ----
  const KEY = "painel-partidas-filtros";
  let F = { win: "3h", cinema: "", fmt: "" };
  try { Object.assign(F, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(F)); } catch (e) {} };

  const selC = document.getElementById("f-cinema");
  const cins = Object.entries(D.cinemas).sort((a, b) => a[1].nome.localeCompare(b[1].nome));
  selC.innerHTML = `<option value="">Todos os cinemas</option>` +
    cins.map(([id, c]) => `<option value="${id}">${c.grupo} · ${esc(c.nome)}</option>`).join("");
  const selF = document.getElementById("f-fmt");
  const FORMATOS = ["VP", "VO", "IMAX", "4DX", "3D", "SCREENX", "XLVISION", "ATMOS"]
    .filter(f => S.some(s => s.formatos.includes(f)));
  selF.innerHTML = `<option value="">Todos</option>` + FORMATOS.map(f => `<option>${f}</option>`).join("");
  if (!D.cinemas[F.cinema]) F.cinema = "";
  if (!FORMATOS.includes(F.fmt)) F.fmt = "";
  selC.value = F.cinema; selF.value = F.fmt;
  selC.addEventListener("change", () => { F.cinema = selC.value; guardar(); render(true); });
  selF.addEventListener("change", () => { F.fmt = selF.value; guardar(); render(true); });
  document.querySelectorAll("[data-win]").forEach(b => b.addEventListener("click", () => {
    F.win = b.dataset.win; guardar(); render(true);
  }));

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ---- placas split-flap ----
  const ROLO = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  function tiles(txt) {
    return `<span class="tiles">${[...txt].map(c => c === ":" || c === " "
      ? `<span class="t sep">${c === ":" ? ":" : ""}</span>` : `<span class="t" data-c="${esc(c)}">${esc(c)}</span>`).join("")}</span>`;
  }
  function virar(root) {
    if (reduce) return;
    root.querySelectorAll(".t[data-c]").forEach((t, i) => {
      const final = t.dataset.c; let n = 4 + (i % 7);
      const tick = () => {
        if (n-- <= 0) { t.textContent = final; return; }
        t.textContent = ROLO[(Math.random() * ROLO.length) | 0];
        setTimeout(tick, 45);
      };
      setTimeout(tick, Math.min(i * 6, 700));
    });
  }

  function estado(min) {
    if (min < 0) return ["Partiu", "gone"];
    if (min <= 10) return ["Última chamada", "warn"];
    if (min <= 30) return ["Embarque", "ok"];
    if (min <= 90) return [`Em ${min} min`, ""];
    return ["A horas", ""];
  }

  function janela(now) {
    const hoje = now.dia, base = diaMs(hoje);
    // Até às 05:00 ainda é o "hoje" de cinema do dia anterior.
    const hojeCinema = now.ms - base < 5 * 3600000 ? isoDe(base - DAY) : hoje;
    const amanha = isoDe(diaMs(hojeCinema) + DAY);
    return s => {
      if (F.win === "3h") return s.ms >= now.ms - 15 * 60000 && s.ms <= now.ms + 3 * 3600000;
      if (F.win === "hoje") return s.dia === hojeCinema && s.ms >= now.ms - 15 * 60000;
      if (F.win === "amanha") return s.dia === amanha;
      return s.ms >= now.ms - 15 * 60000;
    };
  }

  const board = document.getElementById("board");
  let assinatura = "";
  function render(animar) {
    document.querySelectorAll("[data-win]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.win === F.win)));
    const now = agora();
    const dentro = janela(now);
    const lista = S.filter(s => dentro(s) && (!F.cinema || s.cid === F.cinema) && (!F.fmt || s.formatos.includes(F.fmt)));

    const nova = F.win + F.cinema + F.fmt + lista.map(s => s.ms + s.cid + s.fid).join("|");
    const mudou = nova !== assinatura; assinatura = nova;

    document.getElementById("count").textContent =
      `${lista.length} ${lista.length === 1 ? "sessão" : "sessões"}`;

    if (!lista.length) {
      const ultimo = S.length ? S[S.length - 1].dia : null;
      board.innerHTML = ultimo && diaMs(ultimo) + DAY < now.ms
        ? `<div class="empty">O cartaz guardado vai só até <b>${nomeDia(ultimo)}</b>. Volta a correr
           <b>cartaz_porto.py</b> e <b>painel_partidas.py</b> para ver as sessões de hoje.</div>`
        : `<div class="empty">Sem partidas para estes filtros. Experimenta <b>Todas</b> ou outro cinema.</div>`;
      return;
    }

    let html = `<div class="row hdr" role="row">
      <span role="columnheader">Hora<i>Time</i></span><span role="columnheader">Filme<i>Film</i></span>
      <span role="columnheader" class="h-dest">Cinema<i>Destination</i></span><span role="columnheader" class="h-gate">Sala<i>Gate</i></span>
      <span role="columnheader" class="h-fmt">Formato<i>Format</i></span><span role="columnheader" class="h-imdb">IMDb</span>
      <span role="columnheader">Estado<i>Status</i></span></div>`;
    let diaAtual = null;
    for (const s of lista) {
      if (F.win === "todas" && s.dia !== diaAtual) {
        diaAtual = s.dia;
        html += `<div class="row day" role="row">${nomeDia(s.dia)}</div>`;
      }
      const c = D.cinemas[s.cid], f = D.filmes[s.fid] || { titulo: s.fid };
      const min = Math.round((s.ms - now.ms) / 60000);
      const [txt, cls] = estado(min);
      const sala = (s.sala.match(/\d+/) || [""])[0];
      const salaExtra = s.sala.replace(/^Sala\s*\d*\s*[-–]?\s*/i, "");
      const gate = sala ? tiles(sala.padStart(2, "0")) : (salaExtra ? tiles(salaExtra.slice(0, 4).toUpperCase()) : `<span class="none">—</span>`);
      const especiais = s.formatos.filter(x => !["VP", "VO"].includes(x));
      const lingua = s.formatos.find(x => x === "VP" || x === "VO") || "";
      const imdb = f.imdb == null ? `<span class="imdb lo">—</span>`
        : `<a class="imdb${f.imdb < 6.5 ? " lo" : ""}" href="${esc(f.imdb_url)}" target="_blank" rel="noopener">${f.imdb.toFixed(1)}</a>`;
      html += `<div class="row${min < 0 ? " past" : ""}" role="row">
        <span class="time" role="cell">${tiles(s.hora)}</span>
        <span class="film" role="cell"><b title="${esc(f.titulo)}">${esc(f.titulo)}</b>${f.classificacao ? `<em>${esc(f.classificacao)}</em>` : ""}</span>
        <span class="dest" role="cell"><span class="code g-${esc(c.grupo)}" title="${esc(c.completo)}">${esc(c.grupo)}</span><span>${esc(c.nome)}</span></span>
        <span class="gate" role="cell" title="${esc(s.sala || "Sala não indicada")}">${gate}</span>
        <span class="fmt" role="cell">${lingua ? `<b>${lingua}</b>` : ""}${especiais.length ? `<br>${especiais.join(" ")}` : ""}</span>
        <span role="cell">${imdb}</span>
        <span class="status ${cls}" role="cell">${txt}</span>
      </div>`;
    }
    board.innerHTML = html;
    if (animar && mudou) virar(board);
  }

  // ---- relógio ----
  const clock = document.getElementById("clock");
  function relogio() {
    const now = agora();
    clock.innerHTML = tiles(now.hms);
    document.getElementById("today").textContent = nomeDia(now.dia);
  }

  const g = D.gerado_em ? new Date(D.gerado_em) : null;
  document.getElementById("foot").textContent =
    `Horários de ${D.fontes.join(", ")}, juntos por cartaz_porto.py` +
    (g ? `, atualizados a ${g.toLocaleString("pt-PT", { timeZone: "Europe/Lisbon", dateStyle: "long", timeStyle: "short" })}` : "") +
    `. Notas IMDb do dataset oficial do IMDb (0 a 10). A sala só aparece quando o filmspot a indica.`;

  relogio(); render(true);
  setInterval(relogio, 1000);
  let ultimoMin = -1;
  setInterval(() => { const m = Math.floor(agora().ms / 60000); if (m !== ultimoMin) { ultimoMin = m; render(false); } }, 5000);
})();
</script>
